name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'bench/**'
      - 'docs/**'
      - 'test/adopt/**'
      - 'scripts/test-adopt-real-world.mjs'
      - '.phronia/**'
      - '.agents/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'bench/**'
      - 'docs/**'
      - 'test/adopt/**'
      - 'scripts/test-adopt-real-world.mjs'
      - '.phronia/**'
      - '.agents/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'marketplace'
      - '**/*.py'
      - '.github/workflows/ci.yml'
  # Pinned fixtures catch environment drift (git, Python, Node) even when this
  # repository is quiet.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Check Python 3.9 syntax
        run: |
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/phronia-pycache"
          git ls-files -z --recurse-submodules '*.py' | xargs -0 python -m py_compile

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (core + cli)
        run: pnpm typecheck

      - name: Typecheck Python
        run: pnpm --filter @phronia/cli lint:py

      - name: Lint (core + cli)
        run: pnpm lint

      # Build before test: integration tests spawn the real CLI via
      # bin/trellis.js, which imports dist/ and needs build output to exist.
      - name: Build (core then cli)
        run: pnpm build

      - name: Test (core + cli + testing)
        run: pnpm test

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d packages/core/dist
          test -f packages/core/dist/index.js
          test -f packages/core/dist/channel/index.js
          test -f packages/core/dist/task/index.js
          test -d packages/cli/dist
          test -f packages/cli/dist/index.js
          echo "Build verification passed"

  guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Dogfood idempotence
        run: pnpm test:idempotence

      - name: Layout literal ratchet
        run: pnpm check:layout

      - name: Hook cold-start baseline (archived, not gated)
        run: pnpm bench:hooks -- --iterations 5 > /dev/null

  # Adopt a real upstream project pinned to an exact commit. This is the gate
  # that would have caught the "renamed root, stale workflow tree" class of bug:
  # the unit fixture cannot see a real 0.5.x tree with archived tasks, OMV
  # blocks, and three configured platforms.
  adopt-real-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup minimum supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Cache pinned adoption fixtures
        uses: actions/cache@v4
        with:
          path: ~/.cache/phronia-adopt-fixtures
          key: phronia-adopt-fixtures-${{ hashFiles('test/adopt/real-world-projects.json') }}

      - name: Adopt pinned upstream projects
        run: pnpm test:adopt-real-world
